<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - 作物一覧プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-primary { @apply bg-green-600 text-white hover:bg-green-700; } .btn-outline { @apply border-2 border-green-600 text-green-600 hover:bg-green-50; } .card { @apply bg-white rounded-lg shadow-md p-6; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">作物管理</h1>
                    <p class="text-gray-600">作物の一覧と管理</p>
                </div>
                <button class="btn btn-primary">新規作物を追加</button>
            </div>
            <div class="mb-6 flex gap-2">
                <span class="px-4 py-2 rounded-lg text-sm font-medium bg-green-100 text-green-700">すべて</span>
                <a href="ui-preview-crops.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200">農場A</a>
                <a href="ui-preview-crops.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200">農場B</a>
            </div>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="card hover:shadow-lg transition-shadow">
                    <div class="flex justify-between mb-4">
                        <div>
                            <h3 class="text-xl font-semibold text-gray-900">トマト</h3>
                            <p class="text-sm text-gray-500">桃太郎</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">栽培中</span>
                    </div>
                    <div class="space-y-2 text-sm text-gray-600 mb-4">
                        <p>🏠 農場A</p>
                        <p>🌱 植え付け: 2026/01/10</p>
                    </div>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4 pb-4 border-b border-gray-200"><span>🌾 2 収穫</span><span>📋 1 タスク</span></div>
                    <div class="flex gap-2">
                        <button class="btn btn-outline flex-1 text-sm">編集</button>
                        <a href="ui-preview-crop-detail.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">詳細</a>
                    </div>
                </div>
                <div class="card hover:shadow-lg transition-shadow">
                    <div class="flex justify-between mb-4">
                        <div>
                            <h3 class="text-xl font-semibold text-gray-900">レタス</h3>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">栽培中</span>
                    </div>
                    <div class="space-y-2 text-sm text-gray-600 mb-4">
                        <p>🏠 農場A</p>
                        <p>🌱 植え付け: 2026/01/15</p>
                    </div>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4 pb-4 border-b border-gray-200"><span>🌾 0 収穫</span><span>📋 0 タスク</span></div>
                    <div class="flex gap-2">
                        <button class="btn btn-outline flex-1 text-sm">編集</button>
                        <a href="ui-preview-crop-detail.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">詳細</a>
                    </div>
                </div>
                <div class="card hover:shadow-lg transition-shadow">
                    <div class="flex justify-between mb-4">
                        <div><h3 class="text-xl font-semibold text-gray-900">キャベツ</h3></div>
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">収穫済み</span>
                    </div>
                    <div class="space-y-2 text-sm text-gray-600 mb-4"><p>🏠 農場A</p></div>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4 pb-4 border-b border-gray-200"><span>🌾 3 収穫</span><span>📋 0 タスク</span></div>
                    <div class="flex gap-2">
                        <button class="btn btn-outline flex-1 text-sm">編集</button>
                        <a href="ui-preview-crop-detail.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">詳細</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
