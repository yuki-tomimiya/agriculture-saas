<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - 作物詳細プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-outline { @apply border-2 border-green-600 text-green-600 hover:bg-green-50; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="mb-6"><a href="ui-preview-crops.html" class="text-sm text-gray-500 hover:text-gray-700">← 作物一覧</a></div>
            <div class="flex items-start justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">トマト</h1>
                    <p class="text-gray-600">品種: 桃太郎</p>
                    <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">栽培中</span>
                </div>
                <a href="ui-preview-crops.html" class="btn btn-outline">一覧に戻る</a>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <h2 class="text-xl font-semibold mb-4">栽培情報</h2>
                <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><dt class="text-sm text-gray-500">農場</dt><dd><a href="ui-preview-farm-detail.html" class="text-green-600 hover:underline">農場A</a></dd></div>
                    <div><dt class="text-sm text-gray-500">圃場</dt><dd class="text-gray-900">A-1</dd></div>
                    <div><dt class="text-sm text-gray-500">植え付け日</dt><dd class="text-gray-900">2026/01/10</dd></div>
                    <div><dt class="text-sm text-gray-500">収穫予定日</dt><dd class="text-gray-900">2026/06/30</dd></div>
                    <div><dt class="text-sm text-gray-500">GDD基準温度</dt><dd class="text-gray-900">10 ℃</dd></div>
                </dl>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">収穫履歴</h2><a href="#" class="text-sm text-green-600 hover:underline">収穫を記録 →</a></div>
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="text-left py-2 font-semibold text-gray-700">日付</th>
                            <th class="text-right py-2 font-semibold text-gray-700">数量</th>
                            <th class="text-left py-2 font-semibold text-gray-700">メモ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-100"><td><a href="ui-preview-harvest-detail.html" class="text-green-600 hover:underline">2026/01/25</a></td><td class="text-right font-medium">15 kg</td><td class="text-gray-600">初収穫</td></tr>
                        <tr class="border-b border-gray-100"><td><a href="ui-preview-harvest-detail.html" class="text-green-600 hover:underline">2026/01/20</a></td><td class="text-right font-medium">8 kg</td><td class="text-gray-600">-</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">関連タスク</h2><a href="ui-preview-tasks.html" class="text-sm text-green-600 hover:underline">タスク一覧 →</a></div>
                <ul class="space-y-2">
                    <li><a href="ui-preview-task-detail.html" class="flex justify-between py-2 hover:bg-gray-50 -mx-2 px-2 rounded"><span class="font-medium">初回追肥</span><span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-800">未着手</span></a></li>
                </ul>
            </div>
        </main>
    </div>
</body>
</html>
