<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - タスク詳細プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-outline { @apply border-2 border-green-600 text-green-600 hover:bg-green-50; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="mb-6"><a href="ui-preview-tasks.html" class="text-sm text-gray-500 hover:text-gray-700">← タスク一覧</a></div>
            <div class="flex items-start justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">トマトの初回追肥</h1>
                    <div class="flex items-center gap-3 flex-wrap">
                        <span class="px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-800">未着手</span>
                        <span class="px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800">優先度: 中</span>
                    </div>
                </div>
                <a href="ui-preview-tasks.html" class="btn btn-outline">一覧に戻る</a>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <h2 class="text-lg font-semibold mb-2">説明</h2>
                <p class="text-gray-700 whitespace-pre-wrap">定植後2週間目を目安に初回追肥を実施。液肥または化成肥料を株元に。</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <h2 class="text-lg font-semibold mb-4">詳細</h2>
                <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><dt class="text-sm text-gray-500">農場</dt><dd><a href="ui-preview-farm-detail.html" class="text-green-600 hover:underline">農場A</a></dd></div>
                    <div><dt class="text-sm text-gray-500">関連作物</dt><dd><a href="ui-preview-crop-detail.html" class="text-green-600 hover:underline">トマト</a></dd></div>
                    <div><dt class="text-sm text-gray-500">期限</dt><dd class="text-gray-900">2026年2月5日</dd></div>
                    <div><dt class="text-sm text-gray-500">ステータス</dt><dd class="text-gray-900">未着手</dd></div>
                </dl>
            </div>
            <p class="text-sm text-gray-500">※ 編集・完了操作は今後の実装で追加予定です。</p>
        </main>
