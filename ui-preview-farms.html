<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - 農場一覧プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-primary { @apply bg-green-600 text-white hover:bg-green-700; } .btn-outline { @apply border-2 border-green-600 text-green-600 hover:bg-green-50; } .card { @apply bg-white rounded-lg shadow-md p-6; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">農場管理</h1>
                    <p class="text-gray-600">農場の一覧と管理</p>
                </div>
                <button class="btn btn-primary">新規農場を追加</button>
            </div>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="card hover:shadow-lg transition-shadow">
                    <h3 class="text-xl font-semibold text-gray-900 mb-4"><a href="ui-preview-farm-detail.html" class="hover:text-green-600">農場A</a></h3>
                    <p class="text-gray-600 mb-4 line-clamp-2">メインの露地栽培エリア。トマト・レタスを栽培。</p>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4"><span>🌱 5 作物</span><span>📋 3 タスク</span></div>
                    <div class="text-xs text-gray-500 mb-4">📍 43.0500, 141.3500</div>
                    <div class="flex gap-2">
                        <a href="ui-preview-farm-detail.html" class="btn btn-outline flex-1 text-sm text-center">詳細</a>
                        <a href="ui-preview-crops.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">作物を見る</a>
                    </div>
                </div>
                <div class="card hover:shadow-lg transition-shadow">
                    <h3 class="text-xl font-semibold text-gray-900 mb-4"><a href="ui-preview-farm-detail.html" class="hover:text-green-600">農場B</a></h3>
                    <p class="text-gray-600 mb-4 line-clamp-2">ハウス栽培。イチゴ・キュウリ。</p>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4"><span>🌱 4 作物</span><span>📋 2 タスク</span></div>
                    <div class="flex gap-2">
                        <a href="ui-preview-farm-detail.html" class="btn btn-outline flex-1 text-sm text-center">詳細</a>
                        <a href="ui-preview-crops.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">作物を見る</a>
                    </div>
                </div>
                <div class="card hover:shadow-lg transition-shadow">
                    <h3 class="text-xl font-semibold text-gray-900 mb-4"><a href="ui-preview-farm-detail.html" class="hover:text-green-600">農場C</a></h3>
                    <p class="text-gray-600 mb-4 line-clamp-2">新規開拓エリア。</p>
                    <div class="flex gap-4 text-sm text-gray-500 mb-4"><span>🌱 0 作物</span><span>📋 0 タスク</span></div>
                    <div class="flex gap-2">
                        <a href="ui-preview-farm-detail.html" class="btn btn-outline flex-1 text-sm text-center">詳細</a>
                        <a href="ui-preview-crops.html" class="btn flex-1 text-sm text-center bg-blue-600 text-white hover:bg-blue-700">作物を見る</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
