<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - 農場詳細プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-outline { @apply border-2 border-green-600 text-green-600 hover:bg-green-50; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="mb-6"><a href="ui-preview-farms.html" class="text-sm text-gray-500 hover:text-gray-700">← 農場一覧</a></div>
            <div class="flex items-start justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">農場A</h1>
                    <p class="text-gray-600 max-w-2xl">メインの露地栽培エリア。トマト・レタス・キャベツを栽培しています。</p>
                </div>
                <a href="ui-preview-farms.html" class="btn btn-outline">一覧に戻る</a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-sm text-gray-600 mb-1">作物数</h3>
                    <p class="text-2xl font-bold text-green-600">5</p>
                    <a href="ui-preview-crops.html" class="text-sm text-green-600 hover:underline mt-1 inline-block">作物一覧 →</a>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-sm text-gray-600 mb-1">タスク数</h3>
                    <p class="text-2xl font-bold text-orange-600">3</p>
                    <a href="ui-preview-tasks.html" class="text-sm text-green-600 hover:underline mt-1 inline-block">タスク一覧 →</a>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-sm text-gray-600 mb-1">位置情報</h3>
                    <p class="text-sm text-gray-700">43.0500, 141.3500</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <h2 class="text-xl font-semibold mb-4">圃場</h2>
                <ul class="space-y-2">
                    <li class="flex justify-between py-2 border-b border-gray-100"><span class="font-medium">A-1</span><span class="text-sm text-gray-500">500 m²</span></li>
                    <li class="flex justify-between py-2 border-b border-gray-100"><span class="font-medium">A-2</span><span class="text-sm text-gray-500">300 m²</span></li>
                </ul>
            </div>
            <div class="bg-white p-6 rounded-lg shadow mb-8">
                <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">この農場の作物</h2><a href="ui-preview-crops.html" class="text-sm text-green-600 hover:underline">すべて見る →</a></div>
                <ul class="space-y-2">
                    <li><a href="ui-preview-crop-detail.html" class="flex justify-between py-2 hover:bg-gray-50 -mx-2 px-2 rounded"><span class="font-medium">トマト</span><span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-800">栽培中</span></a></li>
                    <li><a href="ui-preview-crop-detail.html" class="flex justify-between py-2 hover:bg-gray-50 -mx-2 px-2 rounded"><span class="font-medium">レタス</span><span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-800">栽培中</span></a></li>
                </ul>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">未完了タスク</h2><a href="ui-preview-tasks.html" class="text-sm text-green-600 hover:underline">すべて見る →</a></div>
                <ul class="space-y-2">
                    <li><a href="ui-preview-task-detail.html" class="flex justify-between py-2 hover:bg-gray-50 -mx-2 px-2 rounded"><span class="font-medium">トマトの初回追肥</span><span class="text-sm text-gray-500">2026/02/05</span></a></li>
                </ul>
            </div>
        </main>
    </div>
</body>
</html>
