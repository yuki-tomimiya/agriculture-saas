<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - 収穫一覧プレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; } .btn-primary { @apply bg-green-600 text-white hover:bg-green-700; } .card { @apply bg-white rounded-lg shadow-md p-6; }</style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-30 h-16 border-b border-gray-200">
        <div class="flex items-center justify-between h-full px-6">
            <a href="ui-preview-index.html" class="text-xl font-bold text-green-600">農業SaaS</a>
            <a href="#" class="text-sm text-gray-600 hover:text-gray-900">ログアウト</a>
        </div>
    </nav>
    <div class="flex pt-16">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto">
            <nav class="p-4 space-y-1">
                <a href="ui-preview-ai-proposal.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">✨</span><span class="text-sm">AIが今日の作業を提案</span></a>
                <a href="ui-preview-dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📊</span><span class="text-sm">ダッシュボード</span></a>
                <a href="ui-preview-farms.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🏡</span><span class="text-sm">農場</span></a>
                <a href="ui-preview-crops.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">🌾</span><span class="text-sm">作物</span></a>
                <a href="ui-preview-harvests.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-green-50 text-green-700 font-semibold border border-green-200"><span class="text-xl">📦</span><span class="text-sm">収穫記録</span></a>
                <a href="ui-preview-tasks.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50"><span class="text-xl">📋</span><span class="text-sm">タスク</span></a>
            </nav>
        </aside>
        <main class="flex-1 ml-64 px-6 py-8">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">収穫記録</h1>
                    <p class="text-gray-600">収穫記録の一覧と管理</p>
                </div>
                <a href="#" class="btn btn-primary">新規収穫記録を追加</a>
            </div>
            <div class="card">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-3 px-4 font-semibold text-gray-900">日付</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-900">作物</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-900">農場</th>
                                <th class="text-right py-3 px-4 font-semibold text-gray-900">収穫量</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-900">メモ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                <td class="py-3 px-4"><a href="ui-preview-harvest-detail.html" class="text-gray-900 hover:text-green-600">2026/01/25</a></td>
                                <td class="py-3 px-4"><a href="ui-preview-crop-detail.html" class="font-medium text-gray-900 hover:text-green-600">トマト</a></td>
                                <td class="py-3 px-4 text-gray-600">農場A</td>
                                <td class="py-3 px-4 text-right font-semibold text-gray-900">15 kg</td>
                                <td class="py-3 px-4 text-gray-600 text-sm">初収穫</td>
                            </tr>
                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                <td class="py-3 px-4"><a href="ui-preview-harvest-detail.html" class="text-gray-900 hover:text-green-600">2026/01/24</a></td>
                                <td class="py-3 px-4"><a href="ui-preview-crop-detail.html" class="font-medium text-gray-900 hover:text-green-600">キャベツ</a></td>
                                <td class="py-3 px-4 text-gray-600">農場A</td>
                                <td class="py-3 px-4 text-right font-semibold text-gray-900">150 kg</td>
                                <td class="py-3 px-4 text-gray-600 text-sm">-</td>
                            </tr>
                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                <td class="py-3 px-4"><a href="ui-preview-harvest-detail.html" class="text-gray-900 hover:text-green-600">2026/01/20</a></td>
                                <td class="py-3 px-4"><a href="ui-preview-crop-detail.html" class="font-medium text-gray-900 hover:text-green-600">トマト</a></td>
                                <td class="py-3 px-4 text-gray-600">農場A</td>
                                <td class="py-3 px-4 text-right font-semibold text-gray-900">8 kg</td>
                                <td class="py-3 px-4 text-gray-600 text-sm">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
