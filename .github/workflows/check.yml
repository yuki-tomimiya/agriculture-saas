name: Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./unused-ci.db
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
