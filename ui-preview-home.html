<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - ホームプレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @layer utilities {
            .btn {
                @apply px-4 py-2 rounded-lg font-medium transition-colors;
            }
            .btn-primary {
                @apply bg-green-600 text-white hover:bg-green-700;
            }
            .btn-outline {
                @apply border-2 border-green-600 text-green-600 hover:bg-green-50;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6;
            }
        }
    </style>
</head>
<body>
    <!-- ホームページ（上に説明 / 下にカード） -->
    <div class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50">
        <div class="container mx-auto px-4 py-16 max-w-7xl">
            <div class="space-y-16">
                <!-- 上：キャッチコピー・説明・CTA -->
                <div class="text-center">
                    <h1 class="text-5xl font-bold text-gray-900 mb-4 leading-tight">
                        農場と作物、作業、<br>お金の流れまで。<br>
                        ぜんぶ、ひとつの画面で。
                    </h1>
                    <p class="text-lg text-gray-700 mb-6 leading-relaxed max-w-3xl mx-auto">
                        中小規模の農家さんと新規就農者のための、<br>
                        「圃場管理 × 作業記録 × 気象データ × 収支管理」をまとめて扱えるクラウドSaaSです。
                    </p>
                    <div class="flex gap-3 justify-center mb-3">
                        <a href="http://localhost:3000/auth/signup" class="inline-flex items-center justify-center bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition text-sm font-semibold shadow-md">
                            無料ではじめる（新規登録）
                        </a>
                        <a href="http://localhost:3000/auth/signin" class="inline-flex items-center justify-center bg-white text-green-700 px-6 py-3 rounded-lg hover:bg-gray-50 transition text-sm font-semibold border border-green-200">
                            すでにアカウントをお持ちの方
                        </a>
                    </div>
                </div>

                <!-- 下：機能カード（人事労務freee風サイドメニュー） -->
                <div class="max-w-4xl mx-auto">
                    <p class="text-xs font-semibold text-gray-500 mb-4 text-center">このサービスでできること</p>
                    <div class="grid grid-cols-2 gap-4">
                        <button class="text-left px-4 py-4 rounded-xl border border-green-200 bg-green-50 hover:bg-green-100 transition flex flex-col gap-2">
                            <span class="text-base font-semibold text-green-800">🏡 農場管理</span>
                            <span class="text-sm text-gray-600">
                                農場・圃場ごとの面積、土壌、設備、作付状況を一元管理。
                            </span>
                        </button>
                        <button class="text-left px-4 py-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition flex flex-col gap-2">
                            <span class="text-base font-semibold text-gray-900">🌾 作物・作業管理</span>
                            <span class="text-sm text-gray-600">
                                作付計画から日々の作業記録、収穫までをスケジュールで把握。
                            </span>
                        </button>
                        <button class="text-left px-4 py-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition flex flex-col gap-2">
                            <span class="text-base font-semibold text-gray-900">📊 データ分析・収支</span>
                            <span class="text-sm text-gray-600">
                                収量・売上・資材コスト・労務を集計し、作物別の収支を見える化。
                            </span>
                        </button>
                        <button class="text-left px-4 py-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition flex flex-col gap-2">
                            <span class="text-base font-semibold text-gray-900">🌤 気象データ連携</span>
                            <span class="text-sm text-gray-600">
                                1週間先までの気象予報から、作業スケジュールを自動で提案。
                            </span>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-6 text-center">
                        ※ 実際のアプリでは、これらのカードがサイドメニューとなり、<br>クリックすると農場管理・作物管理・分析画面などに切り替わるイメージです。
                    </p>
                    <p class="text-xs text-center mt-4">
                        <a href="ui-preview-index.html" class="text-green-600 hover:underline">各ページのプレビュー一覧を見る</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
