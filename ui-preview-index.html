<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農業SaaS - プレビュー一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">農業SaaS プレビュー一覧</h1>
        <p class="text-gray-600 mb-8">各HTMLをブラウザで開いてレイアウトを確認できます。</p>

        <div class="space-y-6">
            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">未ログイン</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-home.html" class="text-green-600 hover:underline">ホーム（ランディング）</a></li>
                </ul>
            </section>

            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">ログイン後（ダッシュボード系）</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-dashboard.html" class="text-green-600 hover:underline">ダッシュボード</a></li>
                    <li><a href="ui-preview-ai-proposal.html" class="text-green-600 hover:underline">今日の提案（AI）</a></li>
                </ul>
            </section>

            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">農場</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-farms.html" class="text-green-600 hover:underline">農場一覧</a></li>
                    <li><a href="ui-preview-farm-detail.html" class="text-green-600 hover:underline">農場詳細</a></li>
                </ul>
            </section>

            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">作物</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-crops.html" class="text-green-600 hover:underline">作物一覧</a></li>
                    <li><a href="ui-preview-crop-detail.html" class="text-green-600 hover:underline">作物詳細</a></li>
                </ul>
            </section>

            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">タスク</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-tasks.html" class="text-green-600 hover:underline">タスク一覧</a></li>
                    <li><a href="ui-preview-task-detail.html" class="text-green-600 hover:underline">タスク詳細</a></li>
                </ul>
            </section>

            <section class="bg-white rounded-xl shadow p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-3">収穫記録</h2>
                <ul class="space-y-2">
                    <li><a href="ui-preview-harvests.html" class="text-green-600 hover:underline">収穫一覧</a></li>
                    <li><a href="ui-preview-harvest-detail.html" class="text-green-600 hover:underline">収穫詳細</a></li>
                </ul>
            </section>
        </div>
    </div>

</html>
